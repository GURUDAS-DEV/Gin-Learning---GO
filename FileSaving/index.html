<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>File Approval</title>
    <style>
        :root {
            color-scheme: light;
            --ink: #17212b;
            --muted: #687785;
            --line: #d9e2e8;
            --paper: #ffffff;
            --accent: #147d72;
            --accent-dark: #0e625a;
            --background: #eef5f3;
        }

        * { box-sizing: border-box; }

        body {
            min-height: 100vh;
            margin: 0;
            display: grid;
            place-items: center;
            padding: 24px;
            color: var(--ink);
            background: radial-gradient(circle at top left, #d9eee9, transparent 42%), var(--background);
            font-family: Georgia, "Times New Roman", serif;
        }

        .panel {
            width: min(100%, 560px);
            padding: clamp(28px, 6vw, 52px);
            background: var(--paper);
            border: 1px solid rgba(23, 33, 43, 0.08);
            box-shadow: 0 24px 70px rgba(30, 65, 68, 0.14);
        }

        .eyebrow {
            margin: 0 0 10px;
            color: var(--accent);
            font: 700 0.75rem/1.2 Arial, sans-serif;
            letter-spacing: 0.14em;
            text-transform: uppercase;
        }

        h1 { margin: 0; font-size: clamp(2rem, 6vw, 3.2rem); line-height: 1; }
        .intro { margin: 16px 0 28px; color: var(--muted); font: 1rem/1.6 Arial, sans-serif; }

        .drop-zone {
            display: block;
            padding: 32px 20px;
            text-align: center;
            border: 1.5px dashed #9bb9b5;
            background: #f6fbfa;
            cursor: pointer;
            transition: border-color 160ms ease, background 160ms ease;
        }

        .drop-zone:hover, .drop-zone.dragging { border-color: var(--accent); background: #eaf6f3; }
        .drop-zone strong { display: block; margin-bottom: 7px; font-size: 1.15rem; }
        .drop-zone span { color: var(--muted); font: 0.86rem/1.4 Arial, sans-serif; }
        input[type="file"] { position: absolute; width: 1px; height: 1px; opacity: 0; }

        .file-name {
            min-height: 22px;
            margin: 18px 0 22px;
            color: var(--accent-dark);
            font: 700 0.9rem/1.4 Arial, sans-serif;
            overflow-wrap: anywhere;
        }

        .file-name p { margin: 5px 0; }

        button {
            width: 100%;
            padding: 14px 18px;
            color: #fff;
            border: 0;
            background: var(--accent);
            font: 700 0.9rem Arial, sans-serif;
            cursor: pointer;
        }

        button:hover { background: var(--accent-dark); }
        button:disabled { opacity: 0.5; cursor: not-allowed; }
        .status { min-height: 20px; margin: 16px 0 0; color: var(--muted); font: 0.85rem/1.4 Arial, sans-serif; }
    </style>
</head>
<body>
    <main class="panel">
        <p class="eyebrow">Document intake</p>
        <h1>Approve files</h1>
        <p class="intro">Choose multiple files to send securely to the upload service for review.</p>

        <form id="upload-form" action="http://localhost:8080/uploadMultiple" method="post" enctype="multipart/form-data">
            <label class="drop-zone" id="drop-zone" for="file-input">
            <strong>Choose files</strong>
            <span>Click here or drop multiple files into this area</span>
            <input id="file-input" name="files" type="file" multiple required>
            </label>
            <p class="file-name" id="file-name">No file selected</p>
            <button id="submit-button" type="submit" disabled>Send for approval</button>
            <p class="status" id="status" role="status"></p>
        </form>
        <button id="gurudas" style="height: 80px; width: 80px; color: red; background-color: black;">
            Go to 
        </button>
    </main>

    <script>
        const form = document.querySelector('#upload-form');
        const input = document.querySelector('#file-input');
        const dropZone = document.querySelector('#drop-zone');
        const fileName = document.querySelector('#file-name');
        const submitButton = document.querySelector('#submit-button');
        const status = document.querySelector('#status');

        function showFiles(files) {
            fileName.replaceChildren();
            submitButton.disabled = files.length === 0;

            if (files.length === 0) {
                fileName.textContent = 'No files selected';
            } else {
                Array.from(files).forEach((file) => {
                    const item = document.createElement('p');
                    item.textContent = `${file.name} (${Math.ceil(file.size / 1024)} KB)`;
                    fileName.appendChild(item);
                });
            }

            status.textContent = '';
        }

        input.addEventListener('change', () => showFiles(input.files));

        ['dragenter', 'dragover'].forEach((eventName) => {
            dropZone.addEventListener(eventName, (event) => {
                event.preventDefault();
                dropZone.classList.add('dragging');
            });
        });

        ['dragleave', 'drop'].forEach((eventName) => {
            dropZone.addEventListener(eventName, (event) => {
                event.preventDefault();
                dropZone.classList.remove('dragging');
            });
        });

        dropZone.addEventListener('drop', (event) => {
            input.files = event.dataTransfer.files;
            showFiles(input.files);
        });

        form.addEventListener('submit', () => {
            submitButton.disabled = true;
            submitButton.textContent = 'Uploading...';
            status.textContent = `Sending ${input.files.length} files for approval.`;
        });

        const redirect = document.getElementById("gurudas")
        redirect.addEventListener("click", async()=>{
            window.location.href = "http://localhost:8080/redirect";
        })  
    </script>
</body>
</html>
